[package]
name = "firebase-tester"
version = "0.1.0"
description = "Calls tauri-plugin-firebase-analytics -crashlytics and -messaging on iOS and Android"
edition = "2021"
publish = false

[lib]
name = "firebase_tester_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-firebase-analytics = { path = "../../../crates/tauri-plugin-firebase-analytics" }
tauri-plugin-firebase-crashlytics = { path = "../../../crates/tauri-plugin-firebase-crashlytics" }
tauri-plugin-firebase-messaging = { path = "../../../crates/tauri-plugin-firebase-messaging" }
