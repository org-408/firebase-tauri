name: CI

# Pull requests: Linux only (cheap). develop and by hand: also iOS on a Mac.
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tauri's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: The autogenerated permissions are up to date
        run: git diff --exit-code -- crates/*/permissions

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: dist-js/ is up to date
        run: git diff --exit-code -- crates/*/dist-js

  android:
    # The Java plugins compile against Tauri's Android library and the Firebase SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Tauri's Android library (the plugins' build scripts copy it next to each plugin)
        run: cargo check --workspace --target aarch64-linux-android
      - run: gradle -p crates/tauri-plugin-firebase-analytics/android compileDebugJavaWithJavac
      - run: gradle -p crates/tauri-plugin-firebase-crashlytics/android compileDebugJavaWithJavac

  ios:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: The newest Xcode
        # With Xcode 26's SwiftPM, swift-rs's `swift build --sdk <iOS SDK>` resolves Firebase's binary frameworks for macOS
        # ("Cocoa/Cocoa.h file not found"); Xcode 27's builds for the SDK it is given (docs/TECH-NOTES.md §9)
        run: |
          ls -d /Applications/Xcode_*.app
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
      - name: The Swift plugins compile with the Firebase iOS SDK (and Tauri's Swift package is in place)
        # --jobs 1: both plugins' Swift builds download the same Firebase binaries into SwiftPM's shared cache, and
        # in parallel they collide ("already exists in file system")
        run: cargo check --workspace --target aarch64-apple-ios-sim --jobs 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The example app builds and links for the Simulator (Firebase's binary frameworks, docs/TECH-NOTES.md §9)
        working-directory: examples/firebase-tester
        run: |
          npx tauri ios init
          npx tauri ios build --debug --target aarch64-sim
