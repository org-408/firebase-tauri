name: CI

# Pull requests: Linux only (cheap). develop and by hand: also iOS on a Mac.
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tauri's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: The autogenerated permissions are up to date
        run: git diff --exit-code -- crates/*/permissions

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: dist-js/ is up to date
        run: git diff --exit-code -- crates/*/dist-js

  android:
    # The Java plugins compile against Tauri's Android library and the Firebase SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Tauri's Android library (the plugins' build scripts copy it next to each plugin)
        run: cargo check --workspace --target aarch64-linux-android
      - run: gradle -p crates/tauri-plugin-firebase-analytics/android compileDebugJavaWithJavac
      - run: gradle -p crates/tauri-plugin-firebase-crashlytics/android compileDebugJavaWithJavac
      - run: gradle -p crates/tauri-plugin-firebase-messaging/android compileDebugJavaWithJavac

  ios:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      # Analytics' Swift package needs Xcode 27 (docs/TECH-NOTES.md §9): with Xcode 26's SwiftPM, swift-rs's
      # `swift build --sdk <iOS SDK>` resolves Firebase's binary frameworks for macOS ("Cocoa/Cocoa.h file not found").
      # The runner images have no Xcode 27 yet, so CI compiles Crashlytics only; Analytics is checked on a Mac with Xcode 27
      # (README, Development). Switch this to the whole workspace and the example app when the runners have Xcode 27.
      - name: The Crashlytics Swift plugin compiles with the Firebase iOS SDK (and Tauri's Swift package is in place)
        run: cargo check -p tauri-plugin-firebase-crashlytics --target aarch64-apple-ios-sim
